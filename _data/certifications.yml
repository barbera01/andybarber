# Headline certifications. Badge paths are relative to the site root; apply
# `| relative_url` in the include. `url` is left empty on purpose —
# do not invent certificate IDs or verification links.
#
# BADGES: Microsoft issues one badge per *level*, not per exam, and the star
# count is the level — Fundamentals 1, Associate 2, Expert 3. Point each
# credential at the badge for its level.
- name: "Microsoft Certified: Azure Solutions Architect Expert"
  issuer: Microsoft
  badge: /assets/images/certifications/microsoft-certified-expert.svg
  alt: Microsoft Certified Expert badge
  url: ""

- name: "Microsoft Certified: Azure AI Engineer Associate"
  issuer: Microsoft
  badge: /assets/images/certifications/microsoft-certified-associate.svg
  alt: Microsoft Certified Associate badge
  url: ""

- name: "HashiCorp Certified: Terraform Associate"
  issuer: HashiCorp
  badge: /assets/images/certifications/terraform-associate.svg
