<!DOCTYPE html>
<html lang="{{ site.lang | default: "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {% assign canonical_url = page.url | remove: "index.html" %}
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ canonical_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ canonical_url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}{{ site.og_image }}">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}{{ site.og_image }}">

  <link rel="icon" href="{{ site.baseurl }}{{ site.favicon }}" type="image/svg+xml">

  <meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1411" media="(prefers-color-scheme: dark)">

  <!-- Type: Archivo (variable — the width axis carries the hierarchy)
       + IBM Plex Mono for labels and readouts. System stack fallback in CSS. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {% include navigation.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</body>
</html>
