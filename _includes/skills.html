<section class="section" id="skills">
  <div class="container">
    <div class="section__header" data-reveal>
      <p class="eyebrow">Skills</p>
      <h2 class="section__title">What I work with</h2>
      <p class="section__lead">
        The platforms, tools and practices I rely on to keep production systems reliable.
      </p>
    </div>

    <div class="skills__grid">
      {% for group in site.data.skills %}
      <div class="skill-group skill-group--{{ forloop.index }}" data-reveal>
        <h3 class="skill-group__title">
          <span class="tick" aria-hidden="true"></span>{{ group.group }}
        </h3>
        <div class="tag-list">
          {% for item in group.items %}
          <span class="tag tag--{{ item | slugify }}">{{ item }}</span>
          {% endfor %}
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
