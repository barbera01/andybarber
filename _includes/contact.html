<section class="section contact" id="contact">
  <div class="container">
    <div class="contact__inner" data-reveal>
      <p class="eyebrow">Contact</p>
      <h2 class="contact__title">Let&rsquo;s build something reliable.</h2>
      <p class="contact__lead">
        I&rsquo;m open to interesting platform, reliability and applied-AI problems.
        The fastest way to reach me is below.
      </p>

      <div class="contact__actions">
        {% for link in site.data.social %}
          {% if link.url != "" %}
          <a class="btn {% if link.icon == "mail" %}btn--primary{% else %}btn--ghost{% endif %}"
            href="{{ link.url }}"{% if link.external %} target="_blank" rel="noopener"{% endif %}>
            {{ link.label }}
          </a>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </div>
</section>
